server:
  port: 8080

spring:
  application:
    name: duty-nextgen
  threads:
    virtual:
      enabled: true

duty:
  # Каталог з місячними файлами графіка (той самий текстовий формат
  # [Names]/[Dates]/[LastDay0]/[LastDay1], що й у застарілому проєкті,
  # але в UTF-8 замість KOI8-U) та внутрішнім git-журналом змін.
  data-dir: ${DUTY_DATA_DIR:./data/duty}
  # Каталог з обліковими записами веб-автентифікації (users.txt) —
  # НЕ пов'язаний з git-історією графіка. У production — окремий
  # зовнішній том, як і data-dir.
  config-dir: ${DUTY_CONFIG_DIR:./config}
  caldav:
    # Порожній base-url = CalDAV-синхронізація вимкнена (типово) —
    # ні фоновий job, ні кнопка "Синхронізувати" нічого не роблять.
    base-url: ${DUTY_CALDAV_BASE_URL:}
    user: ${DUTY_CALDAV_USER:}
    password: ${DUTY_CALDAV_PASSWORD:}
    # Внутрішній кеш стану синку (опубліковані UID + хеші вмісту) —
    # не облікові дані, не графік; можна безпечно стерти.
    state-dir: ${DUTY_CALDAV_STATE_DIR:./data/caldav-state}
